<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask Eya</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f7}.box{max-width:430px;margin:50px auto;background:white;padding:25px;border-radius:24px}
h1{text-align:center}textarea{width:100%;height:150px;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:15px;font-size:16px}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:#111;color:white;font-size:16px}
.note{font-size:12px;color:#777;margin-top:12px}
#result{margin-top:15px;padding:12px;border-radius:12px;display:none}
</style></head>
<body><div class="box">
<h1>Ask Eya 💌</h1>
<p>أرسل لي رسالة</p>
<textarea id="m" maxlength="500" placeholder="اكتب رسالتك هنا..."></textarea>
<label><input id="a" type="checkbox" checked> إرسال مجهول</label>
<button onclick="send()">إرسال</button>
<div id="result"></div>
<p class="note">🛡️ الرسائل المخالفة قد تُحجب تلقائيًا للمراجعة.</p>
</div>
<script>
async function send(){
 const r=document.getElementById("result"), m=document.getElementById("m").value.trim();
 if(!m){r.style.display="block";r.textContent="اكتب الرسالة أولًا.";return}
 const x=await fetch("/api/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m,anonymous:document.getElementById("a").checked})});
 const d=await x.json(); r.style.display="block"; r.textContent=d.message||d.error; document.getElementById("m").value="";
}
</script></body></html>
